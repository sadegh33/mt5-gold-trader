<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gold Trader Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
  <h3>Gold Trader - Live Chart</h3>
  <!-- TradingView Lightweight Widget (public) -->
  <div id="tv_chart"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    new TradingView.widget({
      "width": "100%",
      "height": 500,
      "symbol": "OANDA:XAUUSD",
      "interval": "60",
      "timezone": "Etc/UTC",
      "theme": "light",
      "style": "1",
      "locale": "en",
      "container_id": "tv_chart"
    });
  </script>
  <p>Report: daily / weekly P&L will appear here after trades are logged.</p>
</body>
</html>
